# 서버 포트 설정 (Vue 3000번과 겹치지 않게 기본 8080 사용)
server:
  port: ${PORT:8081}

spring:
  # 데이터베이스 연결 정보 (Supabase PostgreSQL)
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA (Hibernate) 설정
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: true
        format_sql: true

# Supabase JWT 토큰 시크릿키 (추후 로그인 연동 시 사용하기 위해 미리 자리만 만들어둠)
supabase:
  jwt:
    secret: [YOUR_SUPABASE_JWT_SECRET]
